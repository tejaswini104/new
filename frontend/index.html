<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaBoard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1c23;
            --card-bg: #21242d;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #a3e635;
            --accent-hover: #84cc16;
            --border: #334155;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 60px; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.2rem; }
        .logo-icon { background: var(--accent); color: var(--bg); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 800; }
        .live-badge { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--text-muted); border: 1px solid var(--border); padding: 6px 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
        h2 { font-family: 'Space Mono', monospace; font-size: 0.9rem; color: var(--accent); letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        h1 { font-size: 4.5rem; font-weight: 800; line-height: 1.1; margin: 0 0 20px 0; letter-spacing: -2px; }
        .highlight { color: var(--accent); }
        p.subtitle { color: var(--text-muted); font-size: 1.2rem; line-height: 1.6; margin-bottom: 50px; max-width: 500px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 40px; }
        .card h3 { font-family: 'Space Mono', monospace; font-size: 0.9rem; color: var(--accent); margin-top: 0; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; }
        textarea { width: 100%; background: transparent; border: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 1.2rem; resize: none; outline: none; min-height: 100px; }
        textarea::placeholder { color: #475569; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; }
        .char-count { font-family: 'Space Mono', monospace; color: var(--text-muted); font-size: 0.85rem; }
        button { background: var(--accent); color: var(--bg); border: none; padding: 12px 24px; font-weight: 600; font-size: 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        ul { list-style: none; padding: 0; }
        li { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; font-size: 1.1rem; }
        .error { background: #451a1a; color: #f87171; padding: 15px; border-radius: 8px; border: 1px solid #7f1d1d; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><div class="logo-icon">✦</div>IdeaBoard</div>
            <div class="live-badge"><div class="dot"></div> LIVE BOARD</div>
        </div>

        <h2>A small idea can change everything</h2>
        <h1>What's your next<br><span class="highlight">big idea?</span></h1>
        <p class="subtitle">A shared space for sparks, experiments, and the things worth building.</p>

        <!-- React App Mount Point -->
        <div id="root"></div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [ideas, setIdeas] = useState([]);
            const [content, setContent] = useState('');
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);

            const fetchIdeas = async () => {
                try {
                    const res = await fetch('/api/ideas');
                    if (!res.ok) throw new Error('Network response was not ok');
                    const data = await res.json();
                    setIdeas(data);
                    setError(null);
                } catch (err) {
                    setError("Could not load ideas — check that the backend is running.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchIdeas(); }, []);

            const submitIdea = async (e) => {
                e.preventDefault(); // Prevent form reload
                if (!content.trim()) return;
                
                setSubmitting(true);
                try {
                    const res = await fetch('/api/ideas', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: content })
                    });
                    if (!res.ok) throw new Error('Failed to post');
                    
                    setContent(''); // Clear textarea
                    fetchIdeas(); // Refresh list
                } catch (err) {
                    setError("Failed to save the idea. Is the backend running?");
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div>
                    {error && <div className="error">{error}</div>}
                    
                    <div className="card">
                        <h3>Drop an idea</h3>
                        <form onSubmit={submitIdea}>
                            <textarea 
                                placeholder="What if we built something that..." 
                                maxLength="2000"
                                value={content}
                                onChange={(e) => setContent(e.target.value)}
                            ></textarea>
                            <div className="card-footer">
                                <span className="char-count">{content.length}/2000 characters</span>
                                <button type="submit" disabled={submitting}>
                                    {submitting ? 'Adding...' : 'Add to the board ↗'}
                                </button>
                            </div>
                        </form>
                    </div>

                    {loading ? (
                        <p style={{textAlign: 'center', color: '#94a3b8'}}>Loading ideas...</p>
                    ) : (
                        <ul>
                            {ideas.map(idea => (
                                <li key={idea.id}>{idea.content}</li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
